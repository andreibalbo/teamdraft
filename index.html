<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TeamDraft</title>
    <meta name="theme-color" content="#15803d" />

    <!-- Tailwind (Play CDN — no build step) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class", theme: { extend: { colors: { primary: "#15803d" } } } };
    </script>
    <!-- Apply saved theme before paint to avoid a flash of light mode -->
    <script>
      try {
        if (localStorage.getItem("td_theme") === "dark")
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>

    <!-- Firebase compat SDK (only used when STORAGE_BACKEND = "firebase") -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="bg-slate-100 text-slate-800 min-h-screen">
    <!-- Login -->
    <div id="login" class="min-h-screen flex items-center justify-center p-4">
      <form id="login-form" class="bg-white w-full max-w-sm rounded-2xl shadow p-6 flex flex-col gap-4">
        <div class="text-center">
          <div class="text-3xl">⚽</div>
          <h1 class="text-2xl font-bold text-primary">TeamDraft</h1>
          <p class="text-sm text-slate-500">Balance your teams</p>
        </div>
        <input id="login-user" placeholder="Username" autocomplete="username"
          class="border rounded-lg px-3 py-3 text-base" />
        <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password"
          class="border rounded-lg px-3 py-3 text-base" />
        <p id="login-error" class="text-sm text-red-600 hidden">Wrong username or password.</p>
        <button class="bg-primary text-white rounded-lg py-3 font-semibold active:scale-95 transition">
          Log in
        </button>
      </form>
    </div>

    <!-- App -->
    <div id="app" class="hidden">
      <header class="bg-primary text-white sticky top-0 z-20 shadow">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-3">
          <button id="back-btn" class="hidden text-white/90 text-xl leading-none">&larr;</button>
          <h1 id="title" class="font-bold text-lg flex-1 truncate">Groups</h1>
          <button id="theme-btn" class="text-lg px-2" title="Toggle dark mode">🌙</button>
          <button id="logout-btn" class="text-sm bg-white/15 rounded-lg px-3 py-1">Log out</button>
        </div>
      </header>
      <main id="view" class="max-w-3xl mx-auto p-4 pb-24"></main>
    </div>

    <!-- Modal host -->
    <div id="modal-host"></div>

    <script src="js/config.js"></script>
    <script src="js/store.js"></script>
    <script src="js/algorithms.js"></script>
    <script src="js/lineup.js"></script>
    <script src="js/export.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
